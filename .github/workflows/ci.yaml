name: Complete DevOps Project Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./terraform-configs
          file: ./terraform-configs/Dockerfile
          push: true
          tags: |
            julian210/complete-devops-project:${{ env.SHORT_SHA }}
            julian210/complete-devops-project:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configure Git Author
        run: |
          git config --local user.email "hello@julian210.com"
          git config --local user.name "julian01"    
      - name: Update Helm Chart with new image tag
        run: | 
          sed -i "s/tag:.*/tag: ${{ env.SHORT_SHA }}/" ./complete-devops-project-time-printer/values.yaml
          git add ./complete-devops-project-time-printer/values.yaml
          git commit -m "Update image tag to ${{ env.SHORT_SHA }}"
          git push 