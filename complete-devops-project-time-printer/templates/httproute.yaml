{{- if (.Values.httpRoute.enabled | default false) }}
{{- $fullName := include "complete-devops-project-time-printer.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
spec:
  parentRefs:
    - name: gateway
  rules:
    - backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
{{- end }}